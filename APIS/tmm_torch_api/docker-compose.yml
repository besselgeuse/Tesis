version: "3.8"

services:
  # Servicio de la base de datos MySQL autocontenida
  db:
    image: mysql:8.0
    container_name: db-tmm
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Dinosaurio1724
      MYSQL_DATABASE: tmmm_torch_api
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pDinosaurio1724"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Servicio de la API TMM
  api-tmm:
    build: .
    container_name: api-tmm
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      # Apunta al nombre de host 'db' (nombre del servicio en Docker)
      - DATABASE_URL=mysql+pymysql://root:Dinosaurio1724@db:3306/tmmm_torch_api
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000

# Volumen para persistir los datos de MySQL en tu computadora host
volumes:
  mysql_data: